[workspace]
members = [".", "node"]
resolver = "2"

[package]
name = "epub-gen"
version = "0.0.0"
edition = "2021"
include = [
  "**/*.rs",
  "Cargo.toml",
]
exclude = [
  "**/*.epub",
  "**/*.zip",
]

[dependencies]
zip = { version = "0.6.4", default-features = false, features = ["deflate-zlib"] }
slugify = "0.1.0"
chrono = "0.4.24"
[dependencies.uuid]
version = "1.3.0"
features = [
  "v4",
]
